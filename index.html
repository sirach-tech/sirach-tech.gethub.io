<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My first free website with GitHub Pages.</p>
    </header>

    <main>
        <h2>About Me</h2>

        <p>
            Hello! I am learning web development.
            This is my website.
        </p>

        <button onclick="sayHello()">
            Click Me
        </button>

        <p id="message"></p>
    </main>

    <script>
        function sayHello() {
            document.getElementById("message").textContent =
                "Hello! Thanks for visiting my website.";
        }
    </script>

</body>
</html>
